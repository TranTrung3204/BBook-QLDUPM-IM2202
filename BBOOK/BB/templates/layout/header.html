<div class="top-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-md-3">
                <div class="logo">
                    <a href="/">
                        <h1 class="display-6 text-primary" style="font-weight: bold; color: #3F69AA !important;">
                            <i class="fas fa-car-alt me-3"></i>BBOOK</h1>
                    </a>
                </div>
            </div>
            <div class="col-md-6">
                <h2><b>Chào mừng đến với BBOOK</b></h2>
            </div>
            <div class="col-md-3">
                <div class="user">
                    <div class="dropdown">
                        <a href="#" class="dropdown-toggle" data-toggle="dropdown">Tài khoản</a>
                        <div class="dropdown-menu">
                            {% if current_user.is_authenticated %}
                            <a href="" class="dropdown-item"
                               style="display: flex; flex-direction: column; align-items: center; text-align: center;">
                                {% if current_user.avatar %}
                                <img class="rounded-circle" src="{{ current_user.avatar }}" width="70"
                                     alt="{{ current_user.name }}" style="margin-bottom: 5px;"/>
                                {% else %}
                                <img class="rounded-circle"
                                     src="{{ url_for('static',filename='client/img/attachment-img.jpg') }}" width="70"
                                     alt="{{ current_user.name }}" style="margin-bottom: 5px;"/>
                                {% endif %}
                                {{ current_user.name }}
                            </a>
                            <a href="{{ url_for('user_signout') }}" class="dropdown-item">Logout</a>
                            {%else%}
                            <a href="/user-login" class="dropdown-item">Đăng nhập</a>
                            <a href="/register" class="dropdown-item">Đăng ký</a>
                            {% endif %}

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
